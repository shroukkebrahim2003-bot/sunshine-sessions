<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غلاف - Sunshine T Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: white;
            direction: rtl;
        }

        .cover-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            position: relative;
            overflow: hidden;
        }

        /* رسومات خلفية */
        .cover-page::before {
            content: "⭐ 🌟 ⭐ 🌟  🌟 ⭐ 🌟  🌟 ⭐ 🌟";
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            opacity: 0.4;
            letter-spacing: 20px;
            white-space: nowrap;
        }

        .cover-page::after {
            content: "🚀 💡 🎯  🎮 💻 🤖 🧩 🚀 💡 🎯 🧠";
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            opacity: 0.4;
            letter-spacing: 15px;
            white-space: nowrap;
        }

        .floating-icons {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .float-icon {
            position: absolute;
            font-size: 3rem;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        .float-icon:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .float-icon:nth-child(2) { top: 25%; right: 15%; animation-delay: 1s; }
        .float-icon:nth-child(3) { bottom: 25%; left: 15%; animation-delay: 2s; }
        .float-icon:nth-child(4) { bottom: 20%; right: 10%; animation-delay: 3s; }
        .float-icon:nth-child(5) { top: 50%; left: 5%; animation-delay: 4s; }
        .float-icon:nth-child(6) { top: 40%; right: 5%; animation-delay: 5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .cover-content {
            text-align: center;
            color: white;
            z-index: 1;
            max-width: 800px;
            position: relative;
        }

        .logo-container {
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .cover-logo {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: white;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 8px solid rgba(255,255,255,0.5);
        }

        .cover-title {
            font-size: 4.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 4px 4px 10px rgba(0,0,0,0.4);
            color: white;
            letter-spacing: 2px;
        }

        .cover-subtitle {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 50px;
            color: rgba(255,255,255,0.98);
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }

        .cover-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 50px 0;
            font-size: 4rem;
        }

        .cover-icon {
            animation: bounce 2s ease-in-out infinite;
            display: inline-block;
        }

        .cover-icon:nth-child(2) { animation-delay: 0.2s; }
        .cover-icon:nth-child(3) { animation-delay: 0.4s; }
        .cover-icon:nth-child(4) { animation-delay: 0.6s; }
        .cover-icon:nth-child(5) { animation-delay: 0.8s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .cover-info {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 60px 0;
            flex-wrap: wrap;
        }

        .info-box {
            background: rgba(255,255,255,0.25);
            padding: 30px 50px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            border: 4px solid rgba(255,255,255,0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .info-label {
            font-size: 1.4rem;
            font-weight: 600;
            opacity: 0.95;
        }

        .info-value {
            font-size: 2rem;
            font-weight: 800;
        }

        .cover-footer {
            margin-top: 70px;
            padding-top: 40px;
            border-top: 4px solid rgba(255,255,255,0.4);
        }

        .academy-name {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            color: white;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }

        .academy-slogan {
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255,255,255,0.95);
            text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
        }

        @media print {
            .cover-page {
                min-height: 100vh;
                page-break-after: always;
            }
            
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
            
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            .float-icon, .cover-icon {
                animation: none !important;
            }
        }

        @media (max-width: 600px) {
            .cover-title { font-size: 2.5rem; }
            .cover-subtitle { font-size: 1.5rem; }
            .cover-logo { width: 180px; height: 180px; }
            .cover-icons { font-size: 2.5rem; gap: 15px; }
            .info-box { padding: 20px 30px; min-width: 180px; }
            .academy-name { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="cover-page">
        <!-- أيقونات طائرة في الخلفية -->
        <div class="floating-icons">
            <div class="float-icon">🤖</div>
            <div class="float-icon">💻</div>
            <div class="float-icon"></div>
            <div class="float-icon">🧩</div>
            <div class="float-icon"></div>
            <div class="float-icon">💡</div>
        </div>

        <div class="cover-content">
            <!-- اللوجو -->
            <div class="logo-container">
                <img src="https://sunshinetacademy.github.io/Word_luc_01/logo.png" alt="Sunshine T Academy Logo" class="cover-logo">
            </div>
            
            <!-- العنوان -->
            <h1 class="cover-title">سيشن تجريبية</h1>
            <h2 class="cover-subtitle">Introduction to Programming</h2>
            
            <!-- أيقونات متحركة -->
            <div class="cover-icons">
                <span class="cover-icon">🤖</span>
                <span class="cover-icon"></span>
                <span class="cover-icon"></span>
                <span class="cover-icon">🧩</span>
                <span class="cover-icon">🚀</span>
            </div>
            
            <!-- معلومات السيشن -->
            <div class="cover-info">
                <div class="info-box">
                    <span class="info-label">👧👦 السن</span>
                    <span class="info-value">4–14 سنة</span>
                </div>
                <div class="info-box">
                    <span class="info-label">⏱️ المدة</span>
                    <span class="info-value">ساعة واحدة</span>
                </div>
            </div>
            
            <!-- اسم الأكاديمية -->
            <div class="cover-footer">
                <p class="academy-name">Sunshine T Academy</p>
                <p class="academy-slogan">بنحول الحلم لكود</p>
            </div>
        </div>
    </div>
</body>
</html>
