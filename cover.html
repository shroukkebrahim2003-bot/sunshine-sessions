<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine T Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #FFF8E7 0%, #FFE4B5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        /* رسومات خلفية ناعمة */
        .bg-decoration {
            position: absolute;
            font-size: 3rem;
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }

        .bg-decoration:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .bg-decoration:nth-child(2) { top: 15%; right: 15%; animation-delay: 1s; }
        .bg-decoration:nth-child(3) { bottom: 20%; left: 15%; animation-delay: 2s; }
        .bg-decoration:nth-child(4) { bottom: 15%; right: 10%; animation-delay: 3s; }
        .bg-decoration:nth-child(5) { top: 50%; left: 5%; animation-delay: 4s; }
        .bg-decoration:nth-child(6) { top: 40%; right: 5%; animation-delay: 5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .cover-container {
            background: white;
            border-radius: 30px;
            padding: 60px 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 1;
            border: 5px solid #FFE4B5;
        }

        .illustration {
            margin-bottom: 40px;
        }

        .main-illustration {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 20px;
        }

        .logo-section {
            margin: 40px 0;
        }

        .logo-container {
            display: inline-block;
            background: white;
            padding: 25px;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid #FFE4B5;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: contain;
        }

        .academy-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: #5A4A42;
            margin: 25px 0 10px 0;
            letter-spacing: 1px;
        }

        .academy-slogan {
            font-size: 1.3rem;
            color: #8B7355;
            font-weight: 600;
            margin-bottom: 40px;
        }

        .decorative-line {
            width: 60%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #FFE4B5, transparent);
            margin: 30px auto;
            border-radius: 2px;
        }

        .fun-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            font-size: 3rem;
        }

        .fun-icon {
            animation: bounce 2s ease-in-out infinite;
        }

        .fun-icon:nth-child(2) { animation-delay: 0.2s; }
        .fun-icon:nth-child(3) { animation-delay: 0.4s; }
        .fun-icon:nth-child(4) { animation-delay: 0.6s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .corner-decoration {
            position: absolute;
            font-size: 4rem;
            opacity: 0.2;
        }

        .corner-decoration.top-right {
            top: 20px;
            right: 20px;
        }

        .corner-decoration.bottom-left {
            bottom: 20px;
            left: 20px;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
            
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            .cover-container {
                page-break-after: always;
                min-height: 100vh;
            }

            .bg-decoration, .fun-icon {
                animation: none !important;
            }
        }

        @media (max-width: 600px) {
            .cover-container { padding: 40px 25px; }
            .academy-name { font-size: 1.8rem; }
            .logo { width: 140px; height: 140px; }
            .fun-icons { font-size: 2.5rem; gap: 20px; }
        }
    </style>
</head>
<body>
    <!-- رسومات خلفية -->
    <div class="bg-decoration">⭐</div>
    <div class="bg-decoration"></div>
    <div class="bg-decoration">💡</div>
    <div class="bg-decoration">🎨</div>
    <div class="bg-decoration"></div>
    <div class="bg-decoration">🎯</div>

    <div class="cover-container">
        <!-- زوايا مزينة -->
        <div class="corner-decoration top-right">🌈</div>
        <div class="corner-decoration bottom-left">✨</div>

        <!-- أيقونات مرحة -->
        <div class="fun-icons">
            <span class="fun-icon">🤖</span>
            <span class="fun-icon">💻</span>
            <span class="fun-icon"></span>
            <span class="fun-icon">🧩</span>
        </div>

        <!-- اللوجو -->
        <div class="logo-section">
            <div class="logo-container">
                <img src="https://sunshinetacademy.github.io/Word_luc_01/logo.png" alt="Sunshine T Academy" class="logo">
            </div>
        </div>

        <h1 class="academy-name">Sunshine T Academy</h1>
        
        <div class="decorative-line"></div>
        
        <p class="academy-slogan">بنحول الحلم لكود</p>
    </div>
</body>
</html>
